name: FOOD_ALL Realtime Scanner

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: food-github-fallback-scan
  cancel-in-progress: false

jobs:
  scan-food-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Golden Hour Scanner
        run: python food_golden_scanner.py

      - name: Run Export Generator
        run: python export_generator.py

      - name: Commit persisted fallback artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "FoodAllBot"
          git config --global user.email "bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add export/ food_deals_live.json food_scan_health.json
          git commit -m "Auto-scan: refresh FOOD fallback artifacts" || echo "No changes to commit"
          git push origin HEAD:main
