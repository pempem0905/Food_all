name: FOOD_ALL Bulk Venue Scanner

on:
  # ⛔ FROZEN (EMERGENCY FREEZE, user request): schedule disabled, file preserved.
  # To restore: uncomment the 2 lines below.
  # schedule:
  #   - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: food-github-bulk-scan
  cancel-in-progress: false

jobs:
  scan-food-venues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bulk OSM venue discovery
        run: python food_bulk_osm.py

      - name: Commit persisted bulk artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "FoodAllBot"
          git config --global user.email "bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add food_venues_osm_latest.json food_bulk_health.json
          git commit -m "Auto-scan: refresh FOOD bulk venue candidates" || echo "No changes to commit"
          git push origin HEAD:main
