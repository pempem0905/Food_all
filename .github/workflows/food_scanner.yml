name: FOOD_ALL Realtime Scanner

on:
  schedule:
    - cron: '*/30 3-6 * * *'
    - cron: '*/30 10-13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-food-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Golden Hour Scanner
        run: python food_golden_scanner.py

      - name: Run Export Generator
        run: python export_generator.py

      - name: Commit and push updated deals and exports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "FoodAllBot"
          git config --global user.email "bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git status
          git add export/
          git commit -m "Auto-export: venues, dishes, reviews, sources, manifest" || echo "No changes to commit"
          git push origin HEAD:main
