name: FOOD_ALL Realtime Scanner

on:
  schedule:
    - cron: '*/30 3-6 * * *'
    - cron: '*/30 10-13 * * *'
  workflow_dispatch:

jobs:
  scan-food-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Golden Hour Scanner
        run: python food_golden_scanner.py

      - name: Commit and push updated deals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "FoodAllBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add food_deals_live.json
          git commit -m "Auto-update: Golden Hour Deals & Store Vouchers" || exit 0
          git push
- name: Run Data Export Generator
        run: python export_generator.py

      - name: Commit and push updated deals and exports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "FoodAllBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add export/latest/
          git commit -m "Auto-export: venues, dishes, reviews, sources, manifest" || exit 0
          git push
