name: AWS Secret Check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aws_secret_check.yml'

permissions:
  contents: write

jobs:
  verify-aws:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets are present
        shell: bash
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || (echo "AWS_ACCESS_KEY_ID missing" && exit 1)
          test -n "$AWS_SECRET_ACCESS_KEY" || (echo "AWS_SECRET_ACCESS_KEY missing" && exit 1)
          test -n "$AWS_REGION" || (echo "AWS_REGION missing" && exit 1)

      - name: Verify AWS identity
        id: identity
        shell: bash
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Verify Lightsail access in Singapore
        shell: bash
        run: |
          aws lightsail get-regions --region "$AWS_REGION" --query "regions[?name=='ap-southeast-1'].name" --output text | grep -q 'ap-southeast-1'

      - name: Persist verification marker
        shell: bash
        run: |
          cat > aws_check_result.json <<EOF
          {
            "ok": true,
            "region": "$AWS_REGION",
            "account_id": "${{ steps.identity.outputs.account_id }}",
            "principal_arn": "${{ steps.identity.outputs.arn }}",
            "lightsail_api": "ok",
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aws_check_result.json
          git commit -m "chore: record AWS Lightsail verification" || exit 0
          git push
